spring.application.name=payment-service-group-2
server.port=${SERVER_PORT:5005}

# Default active profile (falls back to local if not explicitly specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Authentication Service
auth-service.base-url=${AUTH_SERVER:http://localhost:8081}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# API-key
api.key=${API_KEY:}